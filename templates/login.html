<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HQuinn · Sign in</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-card" aria-labelledby="login-title">
      <div class="brand-mark" aria-hidden="true">H</div>
      <p class="eyebrow">Secure prototype</p>
      <h1 id="login-title">Welcome to HQuinn</h1>
      <p class="muted">Sign in to test the hosted-to-local intelligence relay.</p>
      {% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}
      <form method="post" class="login-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <label>
          <span>Username</span>
          <input name="username" autocomplete="username" required autofocus>
        </label>
        <label>
          <span>Password</span>
          <input name="password" type="password" autocomplete="current-password" required>
        </label>
        <button type="submit" class="primary-button">Continue</button>
      </form>
      <p class="privacy-note">Connection-only test. Do not enter customer or confidential information.</p>
    </section>
  </main>
</body>
</html>
