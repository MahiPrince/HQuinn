services:
  - type: web
    name: hquinn-relay-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 8 --timeout 300 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /healthz
    envVars:
      - key: APP_USERNAME
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: BRIDGE_TOKEN
        generateValue: true

